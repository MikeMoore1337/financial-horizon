name: issue69-transactional-import-ci
on:
  push:
    branches: [feat/69-transactional-import-20261112]
  pull_request:
    branches: [feat/67-finance-http-boundary]
permissions:
  contents: read
concurrency:
  group: issue69-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finance-import-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17@sha256:5b96f1a16bd9768b060dd2ffe55cb6225c4d9ef4d214a8b21eb08134869a97e4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      FH_FINANCE_CI_ALLOW_BOOTSTRAP: "yes"
      FH_FINANCE_MIGRATION_URL: postgresql+psycopg://fh_finance_migrator:ci_migration_password_only@127.0.0.1:5432/fh_finance_ci
      FH_FINANCE_DATABASE_URL: postgresql+psycopg://fh_finance_runtime:ci_runtime_password_only@127.0.0.1:5432/fh_finance_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-finance.txt
      - name: Install isolated finance test dependencies
        run: python -m pip install -r backend/requirements-finance.txt -r backend/requirements-test.txt 'bandit>=1.8,<2'
      - name: Provision disposable roles and database
        run: python backend/finance_db/tests/bootstrap_ci.py
      - name: Apply complete migrations 0001..0003
        run: alembic -c backend/finance_db/alembic.ini upgrade head
      - name: Transactional import + RLS + auth regression
        run: |
          python -m pytest -q backend/finance_db/tests/
          python -m pytest -q backend/finance_api/tests/
          python -m pytest -q backend/tests/
      - name: Python compile and security scan
        run: |
          python -m compileall -q backend/finance_db backend/finance_api backend/fh_email_auth
          python -m bandit -q -r backend/finance_db backend/finance_api backend/fh_email_auth -x backend/finance_db/tests,backend/finance_api/tests,backend/tests

  frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:component
      - run: npm run build
      - run: npm run test:build
      - run: npm run audit:deps
