name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:build
      - run: npm test
      - run: npm run test:component
      - run: node --check app.js && node --check account.js && node --check sw.js && node --check tests/e2e/production-smoke.mjs
      - run: npm run audit:deps

  email-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt 'bandit>=1.8,<2'
      - run: python -m compileall -q backend/fh_email_auth
      - run: python -m bandit -q -r backend/fh_email_auth
      - run: python -m pytest -q backend/tests/

      - name: Compile restricted FH deploy handler
        run: python -m py_compile deploy/fh_static_deploy.py
      - name: Verify restricted deploy bootstrap syntax
        run: bash -n deploy/provision-fh-static-deploy.sh
      - name: Negative static deploy / rollback tests
        run: python -m unittest discover -s tests/deploy -p 'test_*.py' -v

  e2e-real-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The Playwright OCI test image does not include lsb_release; setup-python
      # cache: pip invokes that missing binary. Install pinned Python without pip cache.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r backend/requirements-test.txt
      # Exact Playwright 1.65.0 browser binaries and OS libraries come from
      # the SHA-pinned, version-matched Microsoft CI image. Do not apt-install
      # unpinned host packages or silently replace real Chromium/WebKit E2E.
      - name: Run actual Chromium + WebKit E2E
        timeout-minutes: 12
        run: npm run test:e2e
        env:
          FH_E2E_PYTHON: python3
      - name: Upload synthetic-only failing browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-failures
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  finance-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17@sha256:5b96f1a16bd9768b060dd2ffe55cb6225c4d9ef4d214a8b21eb08134869a97e4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      FH_FINANCE_CI_ALLOW_BOOTSTRAP: "yes"
      FH_FINANCE_MIGRATION_URL: postgresql+psycopg://fh_finance_migrator:ci_migration_password_only@127.0.0.1:5432/fh_finance_ci
      FH_FINANCE_DATABASE_URL: postgresql+psycopg://fh_finance_runtime:ci_runtime_password_only@127.0.0.1:5432/fh_finance_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-finance.txt
      - name: Install isolated finance dependencies
        run: python -m pip install -r backend/requirements-finance.txt -r backend/requirements-test.txt 'bandit>=1.8,<2'
      - name: Provision synthetic finance DB and least-privilege roles
        run: python backend/finance_db/tests/bootstrap_ci.py
      - name: Alembic migrate empty database
        run: alembic -c backend/finance_db/alembic.ini upgrade head
      - name: Alembic repeat migration (idempotent)
        run: alembic -c backend/finance_db/alembic.ini upgrade head
      - name: Non-superuser RLS, finance HTTP and session security integration
        run: python -m pytest -q backend/finance_db/tests/ backend/finance_api/tests/
      - name: Encrypted dump and isolated restore verification
        run: bash deploy/postgres/scripts/ci-restore.sh
        env:
          FH_FINANCE_CI_POSTGRES_CONTAINER: ${{ job.services.pg.id }}
      - name: Build and boot isolated production-compose configuration
        run: bash deploy/postgres/scripts/ci-compose.sh
      - name: Validate dedicated LUKS2 data volume (disposable synthetic device)
        run: bash deploy/postgres/scripts/ci-crypto-volume.sh
      - name: Prevent unsafe downgrade on populated financial DB
        run: |
          if alembic -c backend/finance_db/alembic.ini downgrade base; then
            echo "ERROR: destructive downgrade must be refused"
            exit 1
          fi
          current="$(alembic -c backend/finance_db/alembic.ini current | awk 'NR==1 {print $1}')"
          expected="$(alembic -c backend/finance_db/alembic.ini heads | awk 'NR==1 {print $1}')"
          test -n "$expected" && test "$current" = "$expected"
      - name: Compile finance Python and check shell scripts
        run: |
          python -m compileall -q backend/finance_db
          bash -n deploy/postgres/init/10-roles.sh deploy/postgres/scripts/*.sh

  diagnostic-public-html:
    if: github.event_name == 'pull_request' && github.head_ref == 'diag/72-public-account-html-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download previously deployed immutable archive (read-only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: 44501892556
          repository: MikeMoore1337/financial-horizon
          github-token: ${{ github.token }}
          name: fh-static-release
          path: ${{ runner.temp }}/release
      - name: Compare sanitized public account.html delivery against exact released archive
        shell: bash
        env:
          RELEASE_SHA: a3fb00572c591e2e4a1b04cce831134df3b3e5bd
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile, urllib.request
          from pathlib import Path
          archive=Path(os.environ['RUNNER_TEMP'])/'release/fh-static.tar.gz'
          with tarfile.open(archive,'r:gz') as z:
              expected=z.extractfile('dist/account.html').read()
              manifest=json.loads(z.extractfile('dist/__release.json').read())
              expected_index=z.extractfile('dist/index.html').read()
          def digest(payload): return hashlib.sha256(payload).hexdigest()
          print('EXPECTED_SOURCE_SHA='+str(manifest.get('source_sha')))
          print('EXPECTED_ACCOUNT_HASH='+digest(expected))
          print('EXPECTED_ACCOUNT_BYTES='+str(len(expected)))
          print('EXPECTED_ACCOUNT_ASSETS='+str(re.findall(rb'assets/built/[A-Za-z0-9_.-]+',expected)[:8]))
          for path in ['/__release.json','/account.html','/account.html?sha='+os.environ['RELEASE_SHA'],'/account.html?cachebust=20261119-2','/index.html']:
              req=urllib.request.Request('https://fin-horizon.mikemoore.top'+path, headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as response:
                      body=response.read(2500000)
                      print('PATH='+path+' HTTP='+str(response.status)+' HASH='+digest(body)+' BYTES='+str(len(body)))
                      print('HEADERS='+json.dumps({k:response.headers.get(k) for k in ['Cache-Control','CF-Cache-Status','Age','ETag','Content-Encoding','Content-Type']},sort_keys=True))
                      if path in ['/account.html','/index.html']:
                          doc = expected if path=='/account.html' else expected_index
                          if doc.count(b'</body>')==1:
                              before,tail=doc.split(b'</body>',1)
                              suffix=b'</body>'+tail
                              if body.startswith(before) and body.endswith(suffix):
                                  insertion=body[len(before):len(body)-len(suffix)]
                                  print('EDGE_SCRIPT_SHA256='+digest(insertion)+' EDGE_SCRIPT_BYTES='+str(len(insertion)))
                                  print('EDGE_SHIFTED_SHA256='+digest(insertion[1:]+b'<'))
                                  print('EDGE_FIRST_AND_LAST='+repr(insertion[:1])+','+repr(insertion[-1:]))
                                  print('EDGE_BEACON_PRESENT='+str(b'static.cloudflareinsights.com/beacon.min.js' in insertion))
                          print('PUBLIC_CSP='+repr(response.headers.get('Content-Security-Policy')))
                      if path.startswith('/account.html'):
                          print('MATCHES_RELEASE='+str(body==expected))
                          print('ACTUAL_ACCOUNT_ASSETS='+str(re.findall(rb'assets/built/[A-Za-z0-9_.-]+',body)[:8]))
                          print('HAS_CF_SCRIPT='+str(b'cdn-cgi/' in body))
                          difference=next((i for i,(x,y) in enumerate(zip(body,expected)) if x!=y),None)
                          print('FIRST_DIFFERING_BYTE='+str(difference))
                          if difference is not None:
                              suffix_match=0
                              while (suffix_match < min(len(body),len(expected))-difference
                                     and body[-suffix_match-1]==expected[-suffix_match-1]):
                                  suffix_match+=1
                              injected=body[difference:len(body)-suffix_match if suffix_match else len(body)]
                              replaced=expected[difference:len(expected)-suffix_match if suffix_match else len(expected)]
                              print('INSERTED_BYTES='+str(len(injected))+' REPLACED_BYTES='+str(len(replaced)))
                              print('INSERTION_HEAD_80='+repr(injected[:80]))
                              print('CF_WEB_ANALYTICS='+str(b'Cloudflare Web Analytics' in injected))
                              print('CF_BEACON='+str(b'static.cloudflareinsights.com/beacon.min.js' in injected))
                              print('CF_TAIL_DOMAINS='+repr(sorted(set(re.findall(rb'https://([A-Za-z0-9.-]+)/',injected)))))
                              from html.parser import HTMLParser
                              class InspectScript(HTMLParser):
                                  def handle_starttag(self,tag,attrs):
                                      if tag!='script': return
                                      print('CF_SCRIPT_ATTRS='+repr([key for key,value in attrs]))
                                      print('CF_SCRIPT_SRC_PREFIX='+repr(next((value[:100] for key,value in attrs if key=='src'),'none')))
                                      print('CF_SCRIPT_INTEGRITY_LENGTH='+str(len(next((value for key,value in attrs if key=='integrity'),''))))
                                      data=next((value for key,value in attrs if key=='data-cf-beacon'),None)
                                      if data:
                                          try: print('CF_BEACON_JSON_KEYS='+repr(sorted(json.loads(data).keys())))
                                          except ValueError: print('CF_BEACON_JSON_INVALID=True')
                              InspectScript().feed('<'+injected.decode('utf-8',errors='replace'))
                      if path=='/index.html':
                          print('INDEX_MATCH='+str(body==expected_index)+' EXPECTED_BYTES='+str(len(expected_index)))
                          pos=next((i for i,(x,y) in enumerate(zip(body,expected_index)) if x!=y),None)
                          print('INDEX_FIRST_DIFF='+str(pos))
                          if pos is not None:
                              suffix=0
                              while (suffix < min(len(body),len(expected_index))-pos
                                     and body[-suffix-1]==expected_index[-suffix-1]):
                                  suffix+=1
                              added=body[pos:len(body)-suffix if suffix else len(body)]
                              replaced=expected_index[pos:len(expected_index)-suffix if suffix else len(expected_index)]
                              print('INDEX_INSERTED='+str(len(added))+' REPLACED='+str(len(replaced)))
                              print('INDEX_INSERTION_HEAD_80='+repr(added[:80]))
                              print('INDEX_CF_BEACON='+str(b'static.cloudflareinsights.com/beacon.min.js' in added))
                      if path=='/__release.json': print('MANIFEST_MATCH='+str(json.loads(body)==manifest))
              except Exception as error:
                  print('FETCH_FAILED='+path+':'+type(error).__name__+':'+str(error)[:120])
          PY
