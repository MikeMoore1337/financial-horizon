name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:build
      - run: npm test
      - run: npm run test:component
      - run: node --check app.js && node --check account.js && node --check sw.js && node --check tests/e2e/production-smoke.mjs
      - run: npm run audit:deps

  email-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt 'bandit>=1.8,<2'
      - run: python -m compileall -q backend/fh_email_auth
      - run: python -m bandit -q -r backend/fh_email_auth
      - run: python -m pytest -q backend/tests/

      - name: Compile restricted FH deploy handler
        run: python -m py_compile deploy/fh_static_deploy.py
      - name: Verify restricted deploy bootstrap syntax
        run: bash -n deploy/provision-fh-static-deploy.sh
      - name: Negative static deploy / rollback tests
        run: python -m unittest discover -s tests/deploy -p 'test_*.py' -v

  e2e-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-test.txt
      # Installing browser packages and host libraries in one opaque command
      # previously left synthetic E2E jobs cancelled without a usable failure
      # receipt. Cache only downloadable browser binaries, not host libraries.
      - name: Cache exact-lockfile Playwright browsers
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright host libraries (bounded)
        timeout-minutes: 8
        run: npx playwright install-deps chromium webkit
      - name: Install exact Playwright browser binaries (bounded)
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium webkit
      - name: Run actual Chromium + WebKit E2E
        timeout-minutes: 12
        run: npm run test:e2e
        env:
          FH_E2E_PYTHON: python3
      - name: Upload synthetic-only failing browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-failures
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  finance-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17@sha256:5b96f1a16bd9768b060dd2ffe55cb6225c4d9ef4d214a8b21eb08134869a97e4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      FH_FINANCE_CI_ALLOW_BOOTSTRAP: "yes"
      FH_FINANCE_MIGRATION_URL: postgresql+psycopg://fh_finance_migrator:ci_migration_password_only@127.0.0.1:5432/fh_finance_ci
      FH_FINANCE_DATABASE_URL: postgresql+psycopg://fh_finance_runtime:ci_runtime_password_only@127.0.0.1:5432/fh_finance_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-finance.txt
      - name: Install isolated finance dependencies
        run: python -m pip install -r backend/requirements-finance.txt -r backend/requirements-test.txt 'bandit>=1.8,<2'
      - name: Provision synthetic finance DB and least-privilege roles
        run: python backend/finance_db/tests/bootstrap_ci.py
      - name: Alembic migrate empty database
        run: alembic -c backend/finance_db/alembic.ini upgrade head
      - name: Alembic repeat migration (idempotent)
        run: alembic -c backend/finance_db/alembic.ini upgrade head
      - name: Non-superuser RLS, finance HTTP and session security integration
        run: python -m pytest -q backend/finance_db/tests/ backend/finance_api/tests/
      - name: Encrypted dump and isolated restore verification
        run: bash deploy/postgres/scripts/ci-restore.sh
        env:
          FH_FINANCE_CI_POSTGRES_CONTAINER: ${{ job.services.pg.id }}
      - name: Build and boot isolated production-compose configuration
        run: bash deploy/postgres/scripts/ci-compose.sh
      - name: Validate dedicated LUKS2 data volume (disposable synthetic device)
        run: bash deploy/postgres/scripts/ci-crypto-volume.sh
      - name: Prevent unsafe downgrade on populated financial DB
        run: |
          if alembic -c backend/finance_db/alembic.ini downgrade base; then
            echo "ERROR: destructive downgrade must be refused"
            exit 1
          fi
          current="$(alembic -c backend/finance_db/alembic.ini current | awk 'NR==1 {print $1}')"
          expected="$(alembic -c backend/finance_db/alembic.ini heads | awk 'NR==1 {print $1}')"
          test -n "$expected" && test "$current" = "$expected"
      - name: Compile finance Python and check shell scripts
        run: |
          python -m compileall -q backend/finance_db
          bash -n deploy/postgres/init/10-roles.sh deploy/postgres/scripts/*.sh
