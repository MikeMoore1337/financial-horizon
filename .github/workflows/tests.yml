name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check app.js && node --check account.js && node --check sw.js

  email-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt 'bandit>=1.8,<2'
      - run: python -m compileall -q backend/fh_email_auth
      - run: python -m bandit -q -r backend/fh_email_auth
      - run: python -m pytest -q backend/tests/

  e2e-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-test.txt
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
        env:
          FH_E2E_PYTHON: python3
      - name: Upload synthetic-only failing browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-failures
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7
