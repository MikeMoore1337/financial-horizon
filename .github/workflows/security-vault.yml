name: security-vault
on:
  push:
    branches: [main]
    paths:
      - 'src/security/**'
      - 'tests/local-vault*.test.mjs'
      - 'docs/security/LOCAL_STORAGE_ENCRYPTION.md'
      - '.github/workflows/security-vault.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/security/**'
      - 'tests/local-vault*.test.mjs'
      - 'docs/security/LOCAL_STORAGE_ENCRYPTION.md'
      - '.github/workflows/security-vault.yml'
permissions:
  contents: read
jobs:
  isolated-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc -p src/security/tsconfig.json
      - run: node --test tests/local-vault.test.mjs tests/local-vault-legacy-backup.test.mjs
