name: "Issue 6 - temporary scoped TSX formatter"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fh-issue6-format-once.yml"
permissions:
  contents: write
concurrency:
  group: issue6-format-once
  cancel-in-progress: true
jobs:
  format:
    if: >-
      github.repository == 'MikeMoore1337/financial-horizon' &&
      github.event.pull_request.number == 188 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-6-approved-reserves-ui-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned repository dependencies and format only owned UI files
        run: |
          npm ci
          npx --no-install prettier --write src/react/Calendar.tsx src/react/Obligations.tsx src/react/ReserveHighlights.tsx src/react/Reserves.tsx
      - name: Push scoped formatter changes only to matching exact PR branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const branch = 'feat/issue-6-approved-reserves-ui-20261117';
            let pinned = context.payload.pull_request.head.sha;
            const files = [
              'src/react/Calendar.tsx',
              'src/react/Obligations.tsx',
              'src/react/ReserveHighlights.tsx',
              'src/react/Reserves.tsx',
            ];
            const initial = await github.rest.repos.getBranch({owner, repo, branch});
            if (initial.data.commit.sha !== pinned) {
              core.setFailed('Formatter preflight: PR SHA changed - no write');
              return;
            }
            for (const path of files) {
              const head = await github.rest.repos.getBranch({owner, repo, branch});
              if (head.data.commit.sha !== pinned) {
                core.setFailed('Formatter branch changed during run - stopped');
                return;
              }
              const current = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              if (Array.isArray(current.data) || current.data.type !== 'file') throw Error('Unexpected file');
              const oldContent = Buffer.from(current.data.content, 'base64').toString('utf8');
              const formatted = fs.readFileSync(path, 'utf8');
              if (oldContent === formatted) continue;
              const result = await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha: current.data.sha,
                message: 'style(reserves): apply pinned Prettier to scoped Issue #6 React files',
                content: Buffer.from(formatted, 'utf8').toString('base64'),
              });
              pinned = result.data.commit.sha;
              core.info(path + ': formatted at ' + pinned);
            }
            core.info('Formatter complete: ' + pinned);
