name: account-wire-postgres-ci
on:
  push:
    branches: [feat/33-account-wire-api-integration]
  pull_request:
    branches: [feat/67-finance-http-boundary]
permissions:
  contents: read
concurrency:
  group: account-wire-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  account-wire-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17@sha256:5b96f1a16bd9768b060dd2ffe55cb6225c4d9ef4d214a8b21eb08134869a97e4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Match the parent finance API CI: OAuth import paths are under backend/.
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      FH_FINANCE_CI_ALLOW_BOOTSTRAP: "yes"
      FH_FINANCE_MIGRATION_URL: postgresql+psycopg://fh_finance_migrator:ci_migration_password_only@127.0.0.1:5432/fh_finance_ci
      FH_FINANCE_DATABASE_URL: postgresql+psycopg://fh_finance_runtime:ci_runtime_password_only@127.0.0.1:5432/fh_finance_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-finance.txt
      - name: Install pinned app and finance test dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements-finance.txt -r backend/requirements-test.txt 'bandit>=1.8,<2'
      - name: Provision synthetic PostgreSQL roles and migrate unmodified DDL
        run: |
          python backend/finance_db/tests/bootstrap_ci.py
          alembic -c backend/finance_db/alembic.ini upgrade head
      - name: Execute cross-language TypeScript -> FastAPI -> PostgreSQL tests
        run: python -m pytest -q backend/finance_api/tests/test_ts_wire_roundtrip.py
      - name: Validate source accounts and strict TypeScript
        run: |
          node --test tests/accounts-ledger.test.mjs tests/accounts-invariants.test.mjs tests/accounts-api-wire.test.mjs tests/accounts-domain-typecheck.test.mjs
          npm run lint
          npm run typecheck
          python -m compileall -q backend/finance_api
          python -m bandit -q -r backend/finance_api backend/finance_db -x backend/finance_api/tests,backend/finance_db/tests
