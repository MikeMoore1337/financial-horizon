name: Financial Horizon production static deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact SHA of current main (static assets only)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fh-production-static
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.gate.outputs.sha }}
      archive_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Verify SHA and exact-SHA tests/security-vault workflows
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.release_sha }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'main-only deploy' >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            TARGET_SHA="$MANUAL_SHA"
            [[ "$TARGET_SHA" == "$SELECTED_SHA" ]] || { echo 'Manual SHA mismatch' >&2; exit 1; }
          else
            TARGET_SHA="$SELECTED_SHA"
          fi
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid SHA' >&2; exit 1; }
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$latest" == "$TARGET_SHA" ]] || { echo 'Superseded main' >&2; exit 1; }
          for workflow in tests.yml security-vault.yml; do
            confirmed=false
            for attempt in $(seq 1 100); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$TARGET_SHA&branch=main&event=push&per_page=10" --jq '.workflow_runs[0].conclusion // "pending"')"
              if [[ "$status" == success ]]; then confirmed=true; break; fi
              if [[ "$status" == failure || "$status" == cancelled || "$status" == timed_out || "$status" == action_required ]]; then
                echo "$workflow blocked: $status" >&2; exit 1
              fi
              [[ "$attempt" == 100 ]] || sleep 8
            done
            [[ "$confirmed" == true ]] || { echo "$workflow not green for exact SHA" >&2; exit 1; }
          done
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" == "$TARGET_SHA" ]]
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout verified main (without credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build static assets without production secrets
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          npm ci
          npm run build
          npm run test:build
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('dist/__release.json')
          if p.exists():
              raise SystemExit('Reserved manifest already present')
          p.write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': os.environ['SOURCE_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
          }, sort_keys=True) + '\n')
          PY
      - name: Package dist archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/fh-static.tar.gz" dist
          echo "sha256=$(sha256sum "$RUNNER_TEMP/fh-static.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload only static archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fh-static-release
          path: ${{ runner.temp }}/fh-static.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production-static
      url: https://fin-horizon.mikemoore.top
    steps:
      - name: Download artifact from same workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fh-static-release
          path: ${{ runner.temp }}/release
      - name: Verify archive, current SHA and restricted SSH deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.build.outputs.source_sha }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          FH_DEPLOY_KEY: ${{ secrets.FH_DEPLOY_KEY }}
          FH_DEPLOY_TARGET: ${{ secrets.FH_DEPLOY_TARGET }}
          FH_DEPLOY_PORT: ${{ secrets.FH_DEPLOY_PORT }}
          FH_DEPLOY_KNOWN_HOSTS: ${{ secrets.FH_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release/fh-static.tar.gz"
          [[ -f "$archive" && "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum -c -
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$latest" == "$TARGET_SHA" ]] || { echo 'Main superseded release' >&2; exit 1; }
          [[ -n "$FH_DEPLOY_KEY" && -n "$FH_DEPLOY_KNOWN_HOSTS" &&
             "$FH_DEPLOY_TARGET" =~ ^[a-z_][a-z0-9_-]*@[a-zA-Z0-9.-]+$ &&
             "$FH_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'SSH secrets not provisioned' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/fh-deploy-key"
          hosts="$RUNNER_TEMP/fh-deploy-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$FH_DEPLOY_KEY" > "$key"
          printf '%s\n' "$FH_DEPLOY_KNOWN_HOSTS" > "$hosts"
          output="$RUNNER_TEMP/fh-deploy-result"
          timeout 120 ssh -T -i "$key" -p "$FH_DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 -o "UserKnownHostsFile=$hosts" \
            "$FH_DEPLOY_TARGET" "deploy $TARGET_SHA $ARCHIVE_SHA256" \
            < "$archive" | tee "$output"
          grep -Fxq "PRODUCTION_DEPLOYED=$TARGET_SHA" "$output" ||
            grep -Fxq "ALREADY_DEPLOYED=$TARGET_SHA" "$output" || {
              echo 'Valid production receipt missing' >&2; exit 1;
            }

  public-smoke:
    needs: [build, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download exact artifact from verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fh-static-release
          path: ${{ runner.temp }}/release
      - name: Verify public release SHA, hashes, cache policy and CSP
        shell: bash
        env:
          TARGET_SHA: ${{ needs.build.outputs.source_sha }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from html.parser import HTMLParser
          import os
          from pathlib import Path, PurePosixPath
          import re
          import tarfile
          from urllib import request
          
          repository = "MikeMoore1337/financial-horizon"
          site = "https://fin-horizon.mikemoore.top"
          sha = os.environ["TARGET_SHA"]
          archive = Path(os.environ["RUNNER_TEMP"]) / "release/fh-static.tar.gz"
          expected_archive_hash = os.environ["ARCHIVE_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("FAIL: invalid source SHA")
          if not re.fullmatch(r"[0-9a-f]{64}", expected_archive_hash):
              raise SystemExit("FAIL: invalid archive digest")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_archive_hash:
              raise SystemExit("FAIL: archived build digest changed")
          
          files = {}
          total = 0
          with tarfile.open(archive, "r:gz") as tar:
              members = tar.getmembers()
              if not members or len(members) > 3000:
                  raise SystemExit("FAIL: unexpected archive member count")
              for member in members:
                  name = PurePosixPath(member.name)
                  parts = name.parts
                  if (not parts or parts[0] != "dist"
                          or any(part.startswith(".") or part == ".." for part in parts[1:])
                          or "\\" in member.name or any(ord(ch) < 32 for ch in member.name)):
                      raise SystemExit("FAIL: unsafe archive path")
                  if member.isdir():
                      continue
                  if not member.isfile() or len(parts) < 2 or member.size > 20000000:
                      raise SystemExit("FAIL: unsafe archive member")
                  total += member.size
                  if total > 90000000:
                      raise SystemExit("FAIL: archive too large")
                  key = "/".join(parts[1:])
                  if key in files:
                      raise SystemExit("FAIL: duplicated archive member")
                  data = tar.extractfile(member).read(20000001)
                  if len(data) != member.size:
                      raise SystemExit("FAIL: truncated archive member")
                  files[key] = data
          
          required = {"__release.json", "index.html", "account.html", "sw.js", "manifest.webmanifest"}
          if len(files) < 10 or not required.issubset(files):
              raise SystemExit("FAIL: incomplete static release")
          
          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = request.build_opener(NoRedirect())
          def get(path):
              if not re.fullmatch(r"/[A-Za-z0-9_./-]*", path) or ".." in path:
                  raise SystemExit("FAIL: invalid requested path")
              req = request.Request(site + path, headers={"Cache-Control": "no-cache"})
              with opener.open(req, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit("FAIL: unexpected public HTTP status")
                  payload = response.read(20000001)
                  if len(payload) > 20000000:
                      raise SystemExit("FAIL: oversized public response")
                  return payload, response.headers
          
          archive_manifest = json.loads(files["__release.json"])
          public_manifest, _ = get("/__release.json")
          if json.loads(public_manifest) != archive_manifest:
              raise SystemExit("FAIL: public release manifest differs from exact archive")
          if (archive_manifest.get("source_sha") != sha
                  or archive_manifest.get("repository") != repository):
              raise SystemExit("FAIL: publicly served source SHA/repository mismatched")
          
          def matches_cloudflare_html(expected: bytes, delivered: bytes) -> bool:
              """Only allow one known Cloudflare Web Analytics beacon inserted before </body>."""
              if expected == delivered:
                  return True
              closing = b'</body>'
              if expected.count(closing) != 1 or delivered.count(closing) != 1:
                  return False
              prefix, tail = expected.split(closing, 1)
              suffix = closing + tail
              if not delivered.startswith(prefix) or not delivered.endswith(suffix):
                  return False
              inserted = delivered[len(prefix):-len(suffix)]
              if not (200 <= len(inserted) <= 600):
                  return False
              if not inserted.startswith(b'<script ') or not inserted.endswith(b'</script>'):
                  return False
              try:
                  fragment = inserted.decode('utf-8')
              except UnicodeDecodeError:
                  return False
          
              class Beacon(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.start = None
                      self.attrs = None
                      self.ends = 0
                      self.invalid = False
          
                  def handle_starttag(self, tag, attrs):
                      if tag != 'script' or self.start is not None:
                          self.invalid = True
                          return
                      self.start = self.get_starttag_text()
                      self.attrs = attrs
          
                  def handle_endtag(self, tag):
                      if tag != 'script' or self.start is None:
                          self.invalid = True
                      self.ends += 1
          
                  def handle_data(self, data):
                      if data.strip():
                          self.invalid = True
          
                  def handle_comment(self, data):
                      self.invalid = True
          
                  def handle_entityref(self, name):
                      self.invalid = True
          
                  def handle_charref(self, name):
                      self.invalid = True
          
              parsed = Beacon()
              parsed.feed(fragment)
              parsed.close()
              if parsed.invalid or parsed.start is None or parsed.ends != 1:
                  return False
              if fragment != parsed.start + '</script>':
                  return False
              if [name for name, _ in parsed.attrs] != [
                  'type', 'src', 'integrity', 'data-cf-beacon', 'crossorigin'
              ]:
                  return False
              attrs = dict(parsed.attrs)
              if attrs['type'] != 'module' or attrs['crossorigin'] != 'anonymous':
                  return False
              if not re.fullmatch(
                  r'https://static\.cloudflareinsights\.com/beacon\.min\.js/v[a-z0-9]{40,64}',
                  attrs['src'] or '',
              ):
                  return False
              if not re.fullmatch(r'sha512-[A-Za-z0-9+/=]{88}', attrs['integrity'] or ''):
                  return False
              try:
                  beacon = json.loads(attrs['data-cf-beacon'])
              except (TypeError, ValueError):
                  return False
              if not isinstance(beacon, dict) or set(beacon) != {'r', 'spa', 'token', 'version'}:
                  return False
              if not isinstance(beacon['token'], str) or not re.fullmatch(r'[0-9a-f]{32}', beacon['token']):
                  return False
              if not isinstance(beacon['version'], str) or not re.fullmatch(
                  r'[0-9]+(?:\.[0-9]+){1,3}', beacon['version']
              ):
                  return False
              if type(beacon['r']) not in (int, bool) or type(beacon['spa']) not in (int, bool):
                  return False
              return True
          
          exact_hashes = 0
          normalized_html = 0
          for name, data in sorted(files.items()):
              public_data, headers = get("/" + name)
              exact = hashlib.sha256(public_data).digest() == hashlib.sha256(data).digest()
              if exact:
                  exact_hashes += 1
              else:
                  if name not in {"index.html", "account.html"}:
                      raise SystemExit("FAIL: public static asset SHA-256 mismatch: " + name)
                  if not matches_cloudflare_html(data, public_data):
                      raise SystemExit("FAIL: unexpected public HTML alteration: " + name)
                  if headers.get("CF-Cache-Status") != "DYNAMIC":
                      raise SystemExit("FAIL: edge-transformed HTML had unexpected cache state")
                  normalized_html += 1
                  print("PUBLIC_HTML_EDGE_BEACON=" + name)
              if name in {"index.html", "account.html", "sw.js", "manifest.webmanifest"}:
                  cache_control = headers.get("Cache-Control", "")
                  if "no-store" not in cache_control and "no-cache" not in cache_control:
                      raise SystemExit("FAIL: unsafe HTML/SW cache policy: " + name)
              if name in {"index.html", "account.html"}:
                  csp = headers.get("Content-Security-Policy", "")
                  if "script-src 'self'" not in csp or "static.cloudflareinsights.com" in csp:
                      raise SystemExit("FAIL: external script permitted or missing CSP: " + name)
          
          index, headers = get("/")
          csp = headers.get("Content-Security-Policy", "")
          if not matches_cloudflare_html(files["index.html"], index):
              raise SystemExit("FAIL: root page differs beyond known Cloudflare beacon injection")
          if "script-src 'self'" not in csp or "static.cloudflareinsights.com" in csp:
              raise SystemExit("FAIL: root CSP permits third-party scripts or lacks restriction")
          auth_config, _ = get("/api/auth/email/config")
          auth = json.loads(auth_config)
          if type(auth.get("enabled")) is not bool or auth.get("email_only") is not True:
              raise SystemExit("FAIL: public authentication configuration invalid")
          print("PUBLIC_RELEASE_SHA=" + sha)
          print("PUBLIC_STATIC_SHA256_EXACT=" + str(exact_hashes) + "/" + str(len(files)))
          print("PUBLIC_HTML_EDGE_NORMALIZED=" + str(normalized_html))
          print("PUBLIC_RELEASE_SMOKE=PASS")
          PY
