name: issue68-real-fh-two-device-postgres-ci
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/finance-real-multidevice.spec.mjs'
      - 'tests/e2e/server.py'
      - 'backend/finance_api/**'
      - 'backend/finance_db/**'
      - 'src/react/accounts-finance-gateway.ts'
      - '.github/workflows/issue68-real-fh-two-device-postgres-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/finance-real-multidevice.spec.mjs'
      - 'tests/e2e/server.py'
      - 'backend/finance_api/**'
      - 'backend/finance_db/**'
      - 'src/react/accounts-finance-gateway.ts'
      - '.github/workflows/issue68-real-fh-two-device-postgres-ci.yml'
permissions:
  contents: read
concurrency:
  group: issue68-two-browser-sql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-browser-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:17@sha256:5b96f1a16bd9768b060dd2ffe55cb6225c4d9ef4d214a8b21eb08134869a97e4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      FH_FINANCE_CI_ALLOW_BOOTSTRAP: "yes"
      FH_FINANCE_MIGRATION_URL: postgresql+psycopg://fh_finance_migrator:ci_migration_password_only@127.0.0.1:5432/fh_finance_ci
      FH_FINANCE_DATABASE_URL: postgresql+psycopg://fh_finance_runtime:ci_runtime_password_only@127.0.0.1:5432/fh_finance_ci
      FH_E2E_REAL_FINANCE: "yes"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-finance.txt
      - name: Install synthetic finance HTTP + browser dependencies
        run: |
          python -m pip install -r backend/requirements-finance.txt -r backend/requirements-test.txt
          npm ci
      - name: Bootstrap disposable owner-isolated PostgreSQL
        run: |
          python backend/finance_db/tests/bootstrap_ci.py
          alembic -c backend/finance_db/alembic.ini upgrade head
      - name: Build reviewed accounts-only UI with import kept disabled
        run: |
          npm run lint
          npm run typecheck
          npm run build
          grep -Fq '<meta name="fh-finance-accounts" content="enabled">' dist/index.html
          grep -Fq '<meta name="fh-finance-import" content="disabled">' dist/index.html
      - name: Install real Chromium + WebKit
        run: |
          npx playwright install-deps chromium webkit
          npx playwright install chromium webkit
      - name: Two live FH sessions + PostgreSQL across two distinct browser contexts
        timeout-minutes: 10
        run: npx playwright test tests/e2e/finance-real-multidevice.spec.mjs --project=chromium-desktop --project=webkit-mobile
      - name: Upload only synthetic browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue68-multidevice-synthetic-only
          path: test-results/e2e/
          retention-days: 3
          if-no-files-found: ignore
