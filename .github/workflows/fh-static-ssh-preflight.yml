name: Financial Horizon restricted SSH preflight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: fh-production-ssh-preflight
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: production-static
    steps:
      - name: Check pinned SSH identity and reject arbitrary commands
        shell: bash
        env:
          FH_DEPLOY_KEY: ${{ secrets.FH_DEPLOY_KEY }}
          FH_DEPLOY_TARGET: ${{ secrets.FH_DEPLOY_TARGET }}
          FH_DEPLOY_PORT: ${{ secrets.FH_DEPLOY_PORT }}
          FH_DEPLOY_KNOWN_HOSTS: ${{ secrets.FH_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          fail() { printf 'SSH_PREFLIGHT=FAIL REASON=%s\n' "$1" >&2; exit 1; }

          [[ -n "$FH_DEPLOY_KEY" && -n "$FH_DEPLOY_KNOWN_HOSTS" ]] ||
            fail MISSING_KEY_OR_HOST_IDENTITY
          [[ "$FH_DEPLOY_TARGET" =~ ^fh-deploy@([a-zA-Z0-9.-]+)$ ]] ||
            fail INVALID_TARGET
          target_host="${BASH_REMATCH[1]}"
          [[ "$FH_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] ||
            fail INVALID_PORT
          (( 10#$FH_DEPLOY_PORT > 0 && 10#$FH_DEPLOY_PORT < 65536 )) ||
            fail INVALID_PORT
          umask 077
          key="$RUNNER_TEMP/fh-preflight-key"
          hosts="$RUNNER_TEMP/fh-preflight-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$FH_DEPLOY_KEY" > "$key"
          printf '%s\n' "$FH_DEPLOY_KNOWN_HOSTS" > "$hosts"
          [[ "$(wc -l < "$hosts")" -eq 1 ]] ||
            fail UNEXPECTED_HOST_KEY_LINES
          read -r entry_host entry_type entry_key _ < "$hosts"
          [[ "$entry_host" == "[$target_host]:$FH_DEPLOY_PORT" &&
             "$entry_type" == ssh-ed25519 && -n "$entry_key" ]] ||
            fail HOST_IDENTITY_RECORD_MISMATCH

          expected='SHA256:4GKTOEHN6g/j5P8qCdTX1KNXuGoKMG0qN4cod3DFwYY'
          actual="$(ssh-keygen -E sha256 -lf "$hosts" | awk '{print $2}')" ||
            fail HOST_KEY_INVALID
          [[ "$actual" == "$expected" ]] ||
            fail HOST_KEY_FINGERPRINT_MISMATCH

          # No git checkout, production write, service reload, or deployment.
          # An unauthorized remote command MUST return the known denial.
          result=''
          status=0
          result="$(timeout 35 ssh -F /dev/null -T \
            -i "$key" -p "$FH_DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=12 \
            -o ConnectionAttempts=1 \
            "$FH_DEPLOY_TARGET" 'whoami' 2>&1)" || status=$?

          [[ "$status" -eq 1 ]] ||
            fail UNEXPECTED_SSH_EXIT_STATUS
          grep -Fxq 'FH_DEPLOY_FAILED=COMMAND_REJECTED' <<< "$result" ||
            fail FORCED_COMMAND_NOT_CONFIRMED

          echo 'SSH_HOST_IDENTITY=PASS'
          echo 'SSH_AUTHENTICATION=PASS'
          echo 'SSH_FORCED_COMMAND_DENIAL=PASS'
          echo 'SSH_PREFLIGHT=PASS'
          echo 'PRODUCTION_DEPLOY_PERFORMED=NO'
