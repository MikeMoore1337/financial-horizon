<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="770" viewBox="0 0 1610 770" role="img" aria-labelledby="title desc"><title id="title">Финансовые счета: создание, перевод и конфликт</title><desc id="desc">Три статичных варианта экранов: явное создание счета, подтверждение собственного перевода и безопасный отказ при конфликте. Все суммы вымышленные.</desc><rect width="1610" height="770" fill="#e9eef7"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="16" y="42" fill="#3e4b60" font-size="17" font-weight="790" text-anchor="start">ФИНАНСОВЫЕ СЦЕНАРИИ · МАКЕТЫ, НЕ РАБОТАЮЩИЙ ИНТЕРФЕЙС</text><g transform="translate(16 68)"><rect x="0" y="0" width="508" height="660" rx="22" fill="#f5f7fc" stroke="#e3eaf4" stroke-width="1.2"/><rect x="24" y="23" width="460" height="609" rx="20" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.2"/><text x="46" y="62" fill="#192434" font-size="25" font-weight="780" text-anchor="start">Создать счёт</text><text x="46" y="89" fill="#5c6c83" font-size="13" font-weight="500" text-anchor="start">Начальный остаток указывается явно</text><text x="46" y="135" fill="#5c6c83" font-size="12" font-weight="700" text-anchor="start">Название</text><rect x="46" y="146" width="413" height="48" rx="12" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.2"/><text x="62" y="176" fill="#192434" font-size="15" font-weight="520" text-anchor="start">Мой счёт</text><text x="46" y="220" fill="#5c6c83" font-size="12" font-weight="700" text-anchor="start">Тип счёта</text><rect x="46" y="230" width="413" height="48" rx="12" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.2"/><text x="62" y="260" fill="#192434" font-size="15" font-weight="520" text-anchor="start">Банковский счёт    ▾</text><text x="46" y="302" fill="#5c6c83" font-size="12" font-weight="700" text-anchor="start">Валюта</text><rect x="46" y="314" width="413" height="48" rx="12" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.2"/><text x="62" y="344" fill="#192434" font-size="15" font-weight="520" text-anchor="start">Российский рубль (RUB)</text><text x="46" y="390" fill="#5c6c83" font-size="12" font-weight="700" text-anchor="start">Начальный остаток · обязательно</text><rect x="46" y="402" width="413" height="48" rx="12" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.2"/><text x="62" y="432" fill="#192434" font-size="15" font-weight="520" text-anchor="start">0,00 ₽</text><rect x="46" y="466" width="413" height="67" rx="12" fill="#eef3fb" stroke="none" stroke-width="1.2"/><text x="62" y="490" fill="#192434" font-size="13" font-weight="650" text-anchor="start">Данные других счетов и кредитов</text><text x="62" y="511" fill="#5c6c83" font-size="12" font-weight="500" text-anchor="start">не превращаются в операции автоматически</text><rect x="46" y="551" width="197" height="48" rx="13" fill="#eef3fb" stroke="#e3eaf4" stroke-width="1.2"/><text x="144.5" y="581" fill="#192434" font-size="14" font-weight="740" text-anchor="middle">Отмена</text><rect x="260" y="551" width="199" height="48" rx="13" fill="#3078fa" stroke="#e3eaf4" stroke-width="1.2"/><text x="359.5" y="581" fill="#ffffff" font-size="14" font-weight="740" text-anchor="middle">Создать счёт</text></g><g transform="translate(544 68)"><rect x="0" y="0" width="508" height="660" rx="22" fill="#0e1624" stroke="#304057" stroke-width="1.2"/><rect x="24" y="23" width="460" height="609" rx="20" fill="#172336" stroke="#304057" stroke-width="1.2"/><text x="46" y="62" fill="#eef4ff" font-size="25" font-weight="780" text-anchor="start">Перевести между своими</text><text x="574" y="94" fill="#adbed6" font-size="13" font-weight="500" text-anchor="start">Сумма не является расходом</text><text x="574" y="137" fill="#adbed6" font-size="12" font-weight="690" text-anchor="start">Откуда</text><rect x="574" y="147" width="412" height="48" rx="12" fill="#172336" stroke="#304057" stroke-width="1.2"/><text x="590" y="177" fill="#eef4ff" font-size="15" font-weight="520" text-anchor="start">Основной счёт</text><text x="574" y="218" fill="#adbed6" font-size="12" font-weight="690" text-anchor="start">Куда</text><rect x="574" y="228" width="412" height="48" rx="12" fill="#172336" stroke="#304057" stroke-width="1.2"/><text x="590" y="258" fill="#eef4ff" font-size="15" font-weight="520" text-anchor="start">Накопления</text><text x="574" y="298" fill="#adbed6" font-size="12" font-weight="690" text-anchor="start">Сумма перевода</text><rect x="574" y="309" width="412" height="48" rx="12" fill="#172336" stroke="#304057" stroke-width="1.2"/><text x="590" y="339" fill="#eef4ff" font-size="15" font-weight="520" text-anchor="start">1 000,00 ₽</text><rect x="574" y="375" width="412" height="129" rx="14" fill="#1f3049" stroke="none" stroke-width="1.2"/><text x="591" y="401" fill="#adbed6" font-size="12" font-weight="700" text-anchor="start">Предварительный результат</text><text x="591" y="432" fill="#eef4ff" font-size="13" font-weight="630" text-anchor="start">Основной счёт</text><text x="971" y="432" fill="#eef4ff" font-size="13" font-weight="700" text-anchor="end">135 000 → 134 000 ₽</text><text x="591" y="455" fill="#eef4ff" font-size="13" font-weight="630" text-anchor="start">Накопления</text><text x="971" y="455" fill="#eef4ff" font-size="13" font-weight="700" text-anchor="end">80 000 → 81 000 ₽</text><text x="591" y="484" fill="#66d9af" font-size="12" font-weight="670" text-anchor="start">Сумма всех активов</text><text x="971" y="484" fill="#66d9af" font-size="12" font-weight="770" text-anchor="end">Без изменений</text><rect x="574" y="553" width="193" height="48" rx="13" fill="#1f3049" stroke="#304057" stroke-width="1.2"/><text x="670.5" y="583" fill="#eef4ff" font-size="14" font-weight="740" text-anchor="middle">Отмена</text><rect x="783" y="553" width="203" height="48" rx="13" fill="#6c9dff" stroke="#304057" stroke-width="1.2"/><text x="884.5" y="583" fill="#081625" font-size="14" font-weight="740" text-anchor="middle">Перевести</text></g><g transform="translate(1072 68)"><rect x="0" y="0" width="508" height="660" rx="22" fill="#f5f7fc" stroke="#e3eaf4" stroke-width="1.2"/><rect x="24" y="23" width="460" height="609" rx="20" fill="#ffffff" stroke="#e3eaf4" stroke-width="1.2"/><text x="46" y="62" fill="#192434" font-size="25" font-weight="780" text-anchor="start">Конфликт изменений</text><rect x="1102" y="110" width="412" height="86" rx="15" fill="#fff4e4" stroke="none" stroke-width="1.2"/><text x="1122" y="140" fill="#8b4b13" font-size="16" font-weight="770" text-anchor="start">⚠  Перевод не подтверждён</text><text x="1122" y="166" fill="#8b4b13" font-size="12" font-weight="500" text-anchor="start">Данные изменились на другом устройстве</text><text x="1102" y="247" fill="#192434" font-size="15" font-weight="740" text-anchor="start">Подробности</text><rect x="1102" y="261" width="412" height="118" rx="15" fill="#eef3fb" stroke="none" stroke-width="1.2"/><text x="1122" y="292" fill="#192434" font-size="13" font-weight="720" text-anchor="start">Сервер вернул 409 / 412</text><text x="1122" y="320" fill="#5c6c83" font-size="12" font-weight="500" text-anchor="start">Исходный запрос не считается проведённым.</text><text x="1122" y="344" fill="#5c6c83" font-size="12" font-weight="500" text-anchor="start">Не повторять списание с новым ключом</text><text x="1102" y="432" fill="#192434" font-size="15" font-weight="740" text-anchor="start">Действия</text><rect x="1102" y="447" width="412" height="48" rx="13" fill="#3078fa" stroke="#e3eaf4" stroke-width="1.2"/><text x="1308" y="477" fill="#ffffff" font-size="14" font-weight="740" text-anchor="middle">Обновить остатки</text><rect x="1102" y="505" width="412" height="48" rx="13" fill="#eef3fb" stroke="#e3eaf4" stroke-width="1.2"/><text x="1308" y="535" fill="#192434" font-size="14" font-weight="740" text-anchor="middle">Вернуться без перевода</text><text x="1102" y="601" fill="#5c6c83" font-size="12" font-weight="500" text-anchor="start">При потере сети статус требует проверки</text></g></g></svg>