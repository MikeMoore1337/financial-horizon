[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
timezone = UTC
# Credentials are injected via FH_FINANCE_MIGRATION_URL / PGPASSFILE, never this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = WARNING
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
